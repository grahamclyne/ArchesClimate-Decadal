[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archesclimate-decadal"
version = "0.1.0"
description = "IPSL-DCPP deterministic and flow-matching climate emulation"
readme = "ArchesClimate/README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.11,<3.13"
dependencies = ["hydra-core>=1.3.2,<1.4"]

[project.optional-dependencies]
train = [
    "torch==2.4.1", "torchvision==0.19.1", "numpy>=1.26.4,<2",
    "lightning>=2.6,<2.7", "torchmetrics>=1.8,<2", "tensordict>=0.12,<0.13",
    "diffusers>=0.35,<0.36", "timm>=1.0,<1.1", "pandas>=2.2,<4",
    "xarray>=2024.6,<2027",
    "lovely-tensors>=0.1,<0.2", "submitit>=1.5,<2", "wandb>=0.19,<0.20",
]
analysis = [
    "matplotlib>=3.8,<3.11", "scipy>=1.13,<2", "xarray>=2024.6,<2027",
    "netCDF4>=1.7,<2", "cartopy>=0.24,<0.25", "eofs>=1.4,<2",
]
data = ["huggingface-hub>=0.34,<2", "requests>=2.31,<3"]
preprocessing = ["cdo>=1.6,<2", "netCDF4>=1.7,<2", "xarray>=2024.6,<2027"]
legacy-maps = ["basemap>=1.4,<2"]
dev = ["ruff==0.16.9", "build>=1.2,<2"]

[project.scripts]
archesclimate-config = "ArchesClimate.cli:config_main"
archesclimate-train = "ArchesClimate.cli:train_main"
archesclimate-submit = "ArchesClimate.cli:submit_main"
archesclimate-rollout = "ArchesClimate.cli:rollout_main"
archesclimate-stats = "ArchesClimate.cli:stats_main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ArchesClimate*"]
exclude = ["ArchesClimate.baselines*", "ArchesClimate.ac_paper*", "ArchesClimate.ac_paper_old*", "ArchesClimate.tests*"]

[tool.setuptools.package-data]
ArchesClimate = ["configs/*.yaml", "configs/*/*.yaml", "analysis/bootstrap*results*/*.npz"]

[tool.setuptools.exclude-package-data]
ArchesClimate = ["configs/cluster/jean_zay_*.yaml", "configs/cluster/cleps.yaml"]

[tool.ruff]
required-version = "==0.16.9"
target-version = "py311"
line-length = 88
force-exclude = true
extend-exclude = [
    "build",
    "dist",
    "ArchesClimate/baselines",
    "ArchesClimate/ac_paper",
    "ArchesClimate/ac_paper_old",
    "**/outputs",
    "**/.ipynb_checkpoints",
]

[tool.ruff.lint]
# Keep the pinned version's default correctness rules and enforce import order.
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["ArchesClimate"]

[tool.ruff.lint.per-file-ignores]
# Preserve the established package name used by imports and saved checkpoints.
"ArchesClimate/__init__.py" = ["N999"]

"ArchesClimate/__main__.py" = ["N999"]
"ArchesClimate/stats/__init__.py" = ["N999"]

"ArchesClimate/configs/__init__.py" = ["N999"]
