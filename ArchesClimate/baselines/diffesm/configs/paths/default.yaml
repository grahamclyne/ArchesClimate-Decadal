# path to root directory
# Defaults to current working directory
root_dir: .

# Path to directory where processed netCDF4 files are stored
data_dir: ${oc.env:ARCHESCLIMATE_DATA_ROOT,./data}/dcpp_dataset

# Path to where the JSON files describing the data are stored
json_data_dir: ./configs/data/

# Path to where our generated samples will be saved
save_dir: ${oc.env:ARCHESCLIMATE_ROLLOUTS_ROOT,./artifacts/generated_data}

# Path to where our quantiles will be saved to and accessed
quantile_dir: ${oc.env:ARCHESCLIMATE_ROLLOUTS_ROOT,./artifacts/generated_data}
